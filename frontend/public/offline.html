<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — SIPP-BMN</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, sans-serif;
        background: #f8f9ff;
        color: #0b1c30;
        text-align: center;
        padding: 24px;
      }
      .box { max-width: 380px; }
      .logo {
        width: 72px;
        height: 72px;
        border-radius: 18px;
        background: #00288e;
        margin: 0 auto 20px;
      }
      h1 { font-size: 20px; margin: 0 0 8px; color: #00288e; }
      p { color: #444653; line-height: 1.6; }
      button {
        margin-top: 16px;
        padding: 12px 24px;
        border: none;
        border-radius: 12px;
        background: #00288e;
        color: #fff;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="logo"></div>
      <h1>Tidak Ada Koneksi</h1>
      <p>
        Aplikasi SIPP-BMN membutuhkan koneksi ke server. Pastikan backend berjalan, lalu coba lagi.
      </p>
      <button onclick="location.reload()">Muat Ulang</button>
    </div>
  </body>
</html>
